name: Compilar para Windows

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Compilar con PyInstaller
      run: |
        Remove-Item *.spec -ErrorAction SilentlyContinue
        $CTK_PATH = (python -c "import customtkinter, os; print(os.path.dirname(customtkinter.__file__))").Trim()
        pyinstaller --name HorariosEscolares --windowed --noconsole --paths . --add-data "$CTK_PATH;customtkinter/" src/main.py

    - name: Verificar archivos compilados
      run: |
        ls dist
        ls dist/HorariosEscolares

    - name: Compilar Instalador con NSIS
      run: |
        & "C:\Program Files (x86)\NSIS\makensis.exe" setup.nsi

    - name: Subir artefacto (Instalador de Windows)
      uses: actions/upload-artifact@v4
      with:
        name: Instalador-Windows
        path: InstaladorHorariosEscolares.exe
        retention-days: 7

    - name: Subir a GitHub Releases
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: win-latest
        name: Instalador Windows
        prerelease: true
        files: InstaladorHorariosEscolares.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
