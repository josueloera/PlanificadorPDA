name: Compilar para Windows

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Compilar con PyInstaller (Windows Portable)
      run: |
        pyinstaller --noconfirm --onefile --windowed --icon "icon.ico" --add-data "scheduler_app/templates;scheduler_app/templates" --add-data "scheduler_app/static;scheduler_app/static" main.py --name HorariosEscolares

    - name: Subir artefacto (Ejecutable Portable)
      uses: actions/upload-artifact@v4
      with:
        name: HorariosEscolares-Windows-Portable
        path: dist/HorariosEscolares.exe
        retention-days: 7

    - name: Subir a GitHub Releases
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: win-latest
        name: Horarios Escolares Windows Portable
        prerelease: true
        files: dist/HorariosEscolares.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
