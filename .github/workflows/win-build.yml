name: Compilar para Windows

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Compilar con PyInstaller
      run: |
        Remove-Item *.spec -ErrorAction SilentlyContinue
        $CTK_PATH = (python -c "import customtkinter, os; print(os.path.dirname(customtkinter.__file__))").Trim()
        pyinstaller --name HorariosEscolares --windowed --noconsole --paths . --add-data "$CTK_PATH;customtkinter/" src/main.py

    - name: Verificar archivos compilados
      run: |
        ls dist
        ls dist/HorariosEscolares

    - name: Compilar Instalador
      run: |
        python -c "
        import os
        import subprocess
        import sys

        compiler = None
        for root, dirs, files in os.walk(r'C:\Program Files (x86)'):
            if 'iscc.exe' in files:
                compiler = os.path.join(root, 'iscc.exe')
                print('Found Inno Setup:', compiler)
                break
            elif 'makensis.exe' in files:
                compiler = os.path.join(root, 'makensis.exe')
                print('Found NSIS:', compiler)
                break
                
        if not compiler:
            for root, dirs, files in os.walk(r'C:\Program Files'):
                if 'iscc.exe' in files:
                    compiler = os.path.join(root, 'iscc.exe')
                    break
                elif 'makensis.exe' in files:
                    compiler = os.path.join(root, 'makensis.exe')
                    break
        
        if not compiler:
            print('Could not find ISCC or NSIS!')
            sys.exit(1)
            
        os.makedirs('Output', exist_ok=True)
        script = 'setup.iss' if 'iscc' in compiler.lower() else 'setup.nsi'
        print(f'Running {compiler} {script}...')
        result = subprocess.run([compiler, script], capture_output=True, text=True)
        print('STDOUT:', result.stdout)
        print('STDERR:', result.stderr)
        if result.returncode != 0:
            sys.exit(result.returncode)
        "

    - name: Subir artefacto (Instalador de Windows)
      uses: actions/upload-artifact@v4
      with:
        name: Instalador-Windows
        path: |
          InstaladorHorariosEscolares.exe
          Output/InstaladorHorariosEscolares.exe
        retention-days: 7

    - name: Subir a GitHub Releases
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: win-latest
        name: Instalador Windows
        prerelease: true
        files: |
          InstaladorHorariosEscolares.exe
          Output/InstaladorHorariosEscolares.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
