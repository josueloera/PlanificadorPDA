name: Compilar para Windows

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Compilar con PyInstaller
      run: |
        $CTK_PATH = python -c "import customtkinter, os; print(os.path.dirname(customtkinter.__file__))"
        pyinstaller --name HorariosEscolares --windowed --noconsole --add-data "$CTK_PATH;customtkinter/" src/main.py

    - name: Subir artefacto (Carpeta de Windows)
      uses: actions/upload-artifact@v4
      with:
        name: HorariosEscolares-Windows
        path: dist/HorariosEscolares
        retention-days: 7

    - name: Comprimir ejecutable para Release
      run: |
        Compress-Archive -Path dist/HorariosEscolares -DestinationPath dist/HorariosEscolares-Windows.zip

    - name: Subir a GitHub Releases
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: win-latest
        name: Instalador Windows
        prerelease: true
        files: dist/HorariosEscolares-Windows.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
